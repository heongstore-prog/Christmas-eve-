<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CHRISTMAS EVE TOURNAMENT - Payment Page</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      position: relative;
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    .top-right-badge {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #f1f5f9;
      padding: 4px 8px;
      border-radius: 20px;
    }
    .top-right-badge img {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      object-fit: cover;
    }
    .top-right-badge span {
      font-size: 10px;
      font-weight: 600;
      color: #64748b;
      white-space: nowrap;
    }
    .brand {
      font-size: 14px;
      font-weight: 700;
      color: #6366f1;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
      text-align: left;
    }
    h1 {
      font-size: 22px;
      color: #1e293b;
      margin-bottom: 6px;
    }
    .amount {
      font-size: 32px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 20px;
    }
    .qr-container {
      background: #fafafa;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .qr-container img {
      width: 100%;
      max-width: 250px;
      height: auto;
      border-radius: 8px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: background 0.2s;
    }
    .btn-primary {
      background-color: #10b981;
      color: #ffffff;
    }
    .btn-primary:hover {
      background-color: #059669;
    }
    .btn-secondary {
      background-color: #e2e8f0;
      color: #334155;
    }
    .btn-secondary:hover {
      background-color: #cbd5e1;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-content {
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }
    .modal-content h3 {
      font-size: 18px;
      color: #1e293b;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .modal-content p {
      font-size: 13px;
      color: #475569;
      line-height: 1.5;
      margin-bottom: 12px;
      text-align: left;
    }
    .modal-content ol {
      text-align: left;
      margin-left: 20px;
      margin-bottom: 14px;
      font-size: 13px;
      color: #334155;
      line-height: 1.6;
    }
    .modal-content .refund-note {
      font-size: 12px;
      font-style: italic;
      color: #64748b;
      margin-bottom: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Top Right Logo & Attribution -->
    <div class="top-right-badge">
      <img src="logo.png" alt="Heong Arena Logo" />
      <span>Powered by Heong Arena tools</span>
    </div>

    <div class="brand">HeongArena</div>
    <h1>CHRISTMAS EVE TOURNAMENT</h1>
    <div class="amount">₹100</div>

    <div class="qr-container">
      <img id="qrImage" src="qr-code.png" alt="HeongArena Payment QR Code" />
    </div>

    <div class="btn-group">
      <!-- Proceed to Pay triggers the instruction modal first -->
      <a href="#" onclick="openPaymentModal(event)" class="btn btn-primary">
        Proceed to Pay
      </a>

      <!-- Download QR Button -->
      <button onclick="downloadQR()" class="btn btn-secondary">
        Download QR
      </button>
    </div>
  </div>

  <!-- Instruction Modal Popup -->
  <div id="paymentModal" class="modal-overlay">
    <div class="modal-content">
      <h3>*NOTICE*</h3>
      <p>After payment please return to Heong Arena and submit payment details:</p>
      <ol>
        <li>your upi id</li>
        <li>utr/transaction id</li>
      </ol>
      <p class="refund-note">*For refund please refer to refund policy*</p>
      <div class="btn-group">
        <button onclick="redirectToPayment()" class="btn btn-primary">OK</button>
        <button onclick="closePaymentModal()" class="btn btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const upiDeepLink = "upi://pay?pa=9362580723@nyes&pn=MANCHU%20MANCHU&am=100&cu=INR&tn=CHRISTMAS%20EVE%20TOURNAMENT";

    function openPaymentModal(event) {
      event.preventDefault();
      document.getElementById('paymentModal').style.display = 'flex';
    }

    function closePaymentModal() {
      document.getElementById('paymentModal').style.display = 'none';
    }

    function redirectToPayment() {
      window.location.href = upiDeepLink;
    }

    function downloadQR() {
      const qrImg = document.getElementById('qrImage');
      const link = document.createElement('a');
      link.href = qrImg.src;
      link.download = 'HeongArena_Payment_QR.png';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>

</body>
</html>
